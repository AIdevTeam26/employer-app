server {
  listen 80;
  client_max_body_size 3m;
  root /usr/share/nginx/html;
  index index.html;

  # Browser calls /api/... -> nginx forwards to the backend container
  location /api/ {
    proxy_pass http://backend:4000;
  }

  # React single-page app: any other URL serves index.html
  location / {
    try_files $uri /index.html;
  }
}
