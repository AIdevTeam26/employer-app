services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-employer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-employer_db}
    volumes:
      - pgdata:/var/lib/postgresql/data            # data survives restarts
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql  # runs once, on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-employer} -d ${POSTGRES_DB:-employer_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-employer}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-employer_db}
    depends_on:
      db:
        condition: service_healthy                 # wait until Postgres accepts connections
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
