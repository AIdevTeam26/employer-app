[pytest]
testpaths = tests
pythonpath = tests
addopts = -ra
markers =
    api: tests that call the REST API directly (no browser)
    ui: tests that drive the real website in a browser (Playwright)
    valid: a good row that should be accepted
    required: required-field checks
    datatype: data type and length checks
    email: email format checks
    replace: "replace existing candidate" checks
    duplicate: duplicate email inside the file
