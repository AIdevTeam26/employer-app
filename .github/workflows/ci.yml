name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install        # switch to `npm ci` after you commit frontend/package-lock.json
      - run: npm test
      - run: npm run build

  upload-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start database and API
        run: docker compose up -d --build db backend
      - name: Wait for the API
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:4000/api/health && exit 0; sleep 2; done
          docker compose logs
          exit 1
      - run: pip install -r tests/requirements.txt
      - run: pytest -m "not ui"      # API tests; browser tests (-m ui) run locally
      - name: Stop containers
        if: always()
        run: docker compose down -v
